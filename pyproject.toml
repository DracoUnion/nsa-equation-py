[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsa-equation-py"
version = "2026.9.28.0"
description = "Reverse-engineered reimplementations of legacy tooling (DNS payload-builder, etc.) in portable Python"
readme = "README.md"
license = {text = "SATA"}
authors = [
    {name = "wizardforcel", email = "wizard.z@qq.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
keywords = ["dns", "payload", "re", "reverse-engineering", "cli"]
requires-python = ">=3.6"

[project.optional-dependencies]
netapi32 = ["impacket>=0.10.0"]

[project.urls]
Homepage = "https://github.com/DracoUnion/nsa-equation-py"

[project.scripts]
nsa-equation-py = "nsa_equation.__main__:main"
nsa = "nsa_equation.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nsa_equation*"]

[tool.setuptools.package-data]
"*" = ["*"]